<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>myUNO — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:            #08101E;
    --surface:       #0F1C2E;
    --card:          #162236;
    --card-e:        #1E2D45;
    --fg:            #EDF2FF;
    --muted:         #8FA3B8;
    --muted-2:       #5E7389;
    --border:        rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --hairline:      rgba(255,255,255,0.05);
    --primary:       #00D68F;
    --accent:        #4E7BFF;
    --gold:          #F59E0B;
    --purple:        #A78BFA;
    --teal:          #16BDCA;
    --coral:         #EF4444;
    --danger:        #D93535;
  }
  html.light {
    --bg:            #FAFAF7;
    --surface:       #FFFFFF;
    --card:          #FFFFFF;
    --card-e:        #F5F3EE;
    --fg:            #0C1220;
    --muted:         #57534E;
    --muted-2:       #8A857E;
    --border:        rgba(12,18,32,0.08);
    --border-strong: rgba(12,18,32,0.18);
    --hairline:      rgba(12,18,32,0.06);
    --primary:       #0D6E4F;
    --accent:        #1E3A8A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0;
    background:#05090F;
    color:var(--fg);
    font-family:'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    font-feature-settings: "ss01", "cv11";
  }
  html.light body { background:#EAE7E0; }
  body {
    min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:32px 16px 64px;
  }
  .mono { font-family:'JetBrains Mono', monospace; font-feature-settings:"tnum"; }
  .display { font-family:'Golos Text', 'DM Sans', system-ui, sans-serif; letter-spacing:-0.02em; }
  button { font-family: inherit; }
  ::selection { background: var(--primary); color: #000; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="application/json" id="tweak-defaults">/*EDITMODE-BEGIN*/{
    "roles": [
      "resident",
      "tourist",
      "owner"
    ],
    "primary": "resident",
    "density": "compact",
    "mood": "light",
    "accent": "navy"
  }/*EDITMODE-END*/</script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="tweaks.jsx"></script>
  <script type="text/babel" src="screen.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="mount.jsx"></script>
</body>
</html>
