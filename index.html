<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Force fresh content - no caching for HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>myUNO - All Services in One</title>
    <meta name="description" content="myUNO - Home is where myUNO is. Your life abroad, simplified." />
    <meta name="author" content="myUNO" />
    <meta name="theme-color" content="#d4af37" />
    <meta name="version" content="3.11.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="myUNO" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="canonical" href="https://myuno.app" />

    <meta property="og:title" content="myUNO - Home is where myUNO is" />
    <meta property="og:description" content="Your life abroad, simplified" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myuno.app" />
    <meta property="og:image" content="https://myuno.app/og-image.png" />
    <meta property="og:site_name" content="myUNO" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@myUNOapp" />
    <meta name="twitter:image" content="https://myuno.app/og-image.png" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://api.mapbox.com" />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    
    <!-- Google Fonts: DM Sans + Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
    
    <!-- Version check with forced reload on mismatch -->
    <script>
      (function() {
        // On SW controller change, reload once
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!window.__swReloading) {
              window.__swReloading = true;
              window.location.reload();
            }
          });
        }
        
        // Version check — clear caches AND reload on mismatch
        fetch('/version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var serverVersion = data.version;
            var storedVersion = localStorage.getItem('manifest_version');
            
            console.log('[myUNO] Server: ' + serverVersion + ', Stored: ' + storedVersion);
            localStorage.setItem('manifest_version', serverVersion);
            localStorage.setItem('app_version', serverVersion);
            
            if (storedVersion && storedVersion !== serverVersion) {
              console.log('[myUNO] Version mismatch! Clearing all caches and reloading...');
              
              // Guard against reload loops: max 1 reload per version change
              var reloadKey = 'uno_reloaded_for_' + serverVersion;
              if (sessionStorage.getItem(reloadKey)) {
                console.log('[myUNO] Already reloaded for ' + serverVersion + ', skipping');
                return;
              }
              sessionStorage.setItem(reloadKey, '1');
              
              // 1. Unregister all service workers
              var swPromise = Promise.resolve();
              if ('serviceWorker' in navigator) {
                swPromise = navigator.serviceWorker.getRegistrations().then(function(regs) {
                  return Promise.all(regs.map(function(reg) { return reg.unregister(); }));
                });
              }
              
              // 2. Delete all caches
              var cachePromise = Promise.resolve();
              if ('caches' in window) {
                cachePromise = caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(key) { return caches.delete(key); }));
                });
              }
              
              // 3. After both complete, force reload from network
              Promise.all([swPromise, cachePromise]).then(function() {
                console.log('[myUNO] Caches cleared, reloading...');
                window.location.reload();
              });
            }
          })
          .catch(function() {
            console.log('[myUNO] Version check failed (offline?)');
          });
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
