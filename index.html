    <!-- Runs without the app bundle: a missing entry must not leave an endless splash. -->
    <script id="myuno-boot-recovery">
      (function () {
        var retrying = false;
        function showRecovery() {
          var splash = document.querySelector('#root > [data-myuno-bootstrap-splash]');
          if (!splash || splash.querySelector('button')) return;
          var language = (document.documentElement.lang || navigator.language || 'en').slice(0, 2);
          var copy = language === 'ru'
            ? ['Не удалось загрузить myUNO', 'Проверьте подключение и попробуйте снова. Ваши данные сохранены.', 'Повторить']
            : language === 'th'
              ? ['โหลด myUNO ไม่สำเร็จ', 'ตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง ข้อมูลของคุณยังคงอยู่', 'ลองอีกครั้ง']
              : ['myUNO could not load', 'Check your connection and try again. Your saved data is kept.', 'Try again'];
          splash.textContent = '';
          splash.style.flexDirection = 'column';
          splash.style.gap = '16px';
          splash.style.padding = '24px';
          splash.style.textAlign = 'center';
          splash.setAttribute('role', 'alert');
          splash.removeAttribute('aria-label');
          var title = document.createElement('h1'); title.textContent = copy[0];
          var message = document.createElement('p'); message.textContent = copy[1];
          var button = document.createElement('button'); button.type = 'button'; button.textContent = copy[2];
          button.style.cssText = 'min-height:44px;padding:12px 24px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer';
          button.onclick = function () {
            if (retrying) return;
            retrying = true; button.disabled = true;
            var reloaded = false;
            function reload() { if (!reloaded) { reloaded = true; window.location.reload(); } }
            // Update only the existing worker; never delete caches, credentials or drafts.
            if ('serviceWorker' in navigator) {
              setTimeout(reload, 2500);
              navigator.serviceWorker.getRegistration().then(function (registration) {
                return registration ? registration.update() : undefined;
              }).then(reload, reload);
            } else reload();
          };
          splash.appendChild(title); splash.appendChild(message); splash.appendChild(button);
        }
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (!target || target.tagName !== 'SCRIPT' || target.type !== 'module' || !target.src) return;
          var source = new URL(target.src, window.location.href);
          if (source.origin !== window.location.origin) return;
          if (!document.querySelector('#root > [data-myuno-bootstrap-splash]')) return;
          // One bounded navigation per entry version. Storage unavailable => show recovery only.
          try {
            var key = 'myuno:boot-retry:' + source.pathname;
            if (!sessionStorage.getItem(key) && !new URL(window.location.href).searchParams.has('_bootRetry')) {
              sessionStorage.setItem(key, '1');
              var next = new URL(window.location.href);
              next.searchParams.set('_bootRetry', String(Date.now()));
              window.location.replace(next.href);
              return;
            }
          } catch (error) {}
          showRecovery();
        }, true);
        // Only the static bootstrap indicator is owned here; React route loaders are not.
        setTimeout(showRecovery, 20000);
      })();
    </script>

    <!-- Version check with forced reload on mismatch -->
    <script>
      (function() {
        var isProductionHost = location.hostname === 'myuno.app' || location.hostname === 'www.myuno.app';
        var isInIframe = false;
        try { isInIframe = window.self !== window.top; } catch(e) { isInIframe = true; }

        if (isProductionHost && !isInIframe && 'serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }

        function hasUnsavedDrafts() {
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf('vendor_draft_property_editor_') === 0) return true;
            }
          } catch(e) {}
          return false;
        }

        function safeReload() {
          if (hasUnsavedDrafts()) {
            console.log('[myUNO] Unsaved drafts detected — deferring reload until user leaves editor');
            window.__swPendingReload = true;
            return false;
          }
          return true;
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!window.__swReloading && safeReload()) {
              window.__swReloading = true;
              window.location.reload();
            }
          });
          
          navigator.serviceWorker.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'SW_UPDATED') {
              console.log('[myUNO] SW_UPDATED received');
              if (!window.__swReloading && safeReload()) {
                window.__swReloading = true;
                window.location.href = window.location.href;
              }
            }
          });
        }
        
        // Passive version check — records latest version without forcing a reload.
        // Real updates are driven by the service worker (controllerchange / SW_UPDATED),
        // which correctly waits for an actual new build to take control. This avoids
        // mid-session reload loops (e.g. when switching themes) caused by racing
        // caches.delete() against the app bootstrap.
        fetch('/version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var serverVersion = data.version;
            var metaTag = document.querySelector('meta[name="version"]');
            var htmlVersion = metaTag ? metaTag.getAttribute('content') : null;
            console.log('[myUNO] Server: ' + serverVersion + ', HTML: ' + htmlVersion);
            localStorage.setItem('manifest_version', serverVersion);
            localStorage.setItem('app_version', serverVersion);
            if (htmlVersion && htmlVersion !== serverVersion) {
              console.log('[myUNO] New build available — will reload on next SW activation');
            }
          })
          .catch(function() {
            console.log('[myUNO] Version check failed (offline?)');
          });
      })();
    </script>
