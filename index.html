    <!-- Version check with forced reload on mismatch -->
    <script>
      (function() {
        var isProductionHost = location.hostname === 'myuno.app' || location.hostname === 'www.myuno.app';
        var isInIframe = false;
        try { isInIframe = window.self !== window.top; } catch(e) { isInIframe = true; }

        if (isProductionHost && !isInIframe && 'serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }

        function hasUnsavedDrafts() {
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf('vendor_draft_property_editor_') === 0) return true;
            }
          } catch(e) {}
          return false;
        }

        function safeReload() {
          if (hasUnsavedDrafts()) {
            console.log('[myUNO] Unsaved drafts detected — deferring reload until user leaves editor');
            window.__swPendingReload = true;
            return false;
          }
          return true;
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!window.__swReloading && safeReload()) {
              window.__swReloading = true;
              window.location.reload();
            }
          });
          
          navigator.serviceWorker.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'SW_UPDATED') {
              console.log('[myUNO] SW_UPDATED received');
              if (!window.__swReloading && safeReload()) {
                window.__swReloading = true;
                window.location.href = window.location.href;
              }
            }
          });
        }
        
        // Passive version check — records latest version without forcing a reload.
        // Real updates are driven by the service worker (controllerchange / SW_UPDATED),
        // which correctly waits for an actual new build to take control. This avoids
        // mid-session reload loops (e.g. when switching themes) caused by racing
        // caches.delete() against the app bootstrap.
        fetch('/version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var serverVersion = data.version;
            var metaTag = document.querySelector('meta[name="version"]');
            var htmlVersion = metaTag ? metaTag.getAttribute('content') : null;
            console.log('[myUNO] Server: ' + serverVersion + ', HTML: ' + htmlVersion);
            localStorage.setItem('manifest_version', serverVersion);
            localStorage.setItem('app_version', serverVersion);
            if (htmlVersion && htmlVersion !== serverVersion) {
              console.log('[myUNO] New build available — will reload on next SW activation');
            }
          })
          .catch(function() {
            console.log('[myUNO] Version check failed (offline?)');
          });
      })();
    </script>

    <!-- Apply stored theme before paint to prevent flash -->
    <script>

    <div id="root">
      <div class="uno-splash" aria-label="Loading myUNO">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#0A2240" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>

    <!-- Splash timeout fallback: if main.tsx never reaches createRoot.render
         (CSP block, 404 chunk, stale SW serving broken bundle), surface a
         recoverable message instead of an infinite spinner. -->
    <script>
      (function () {
        var TIMEOUT_MS = 15000;
        setTimeout(function () {
          if (window.__uno_render_marker) return;
          var root = document.getElementById('root');
          if (!root) return;
          var lang = (document.documentElement.getAttribute('lang') || 'en').toLowerCase();
          var ru = lang.indexOf('ru') === 0;
          var title = ru ? 'Не удалось загрузить приложение' : "Couldn't load the app";
          var body = ru
            ? 'Похоже, что-то пошло не так. Обновите страницу или очистите данные сайта в настройках браузера.'
            : 'Something went wrong. Refresh the page, or clear site data from your browser settings.';
          var btnReload = ru ? 'Обновить' : 'Reload';
          var btnReset = ru ? 'Очистить и обновить' : 'Clear & reload';
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F7F5F1;color:#1C1917;font-family:system-ui,-apple-system,sans-serif">' +
            '<div style="max-width:520px;width:100%;background:#fff;border:1px solid #e7e5e4;border-radius:14px;padding:24px">' +
            '<h1 style="font-size:18px;line-height:1.3;margin:0 0 10px">' + title + '</h1>' +
            '<p style="margin:0 0 16px;line-height:1.55;color:#44403c">' + body + '</p>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
            '<button id="uno-fb-reload" style="padding:10px 16px;border-radius:10px;border:1px solid #0A2240;background:#0A2240;color:#fff;font:inherit;cursor:pointer">' + btnReload + '</button>' +
            '<button id="uno-fb-reset" style="padding:10px 16px;border-radius:10px;border:1px solid #d6d3d1;background:#fff;color:#1C1917;font:inherit;cursor:pointer">' + btnReset + '</button>' +
            '</div></div></div>';
          var rb = document.getElementById('uno-fb-reload');
          if (rb) rb.addEventListener('click', function () { window.location.reload(); });
          var rs = document.getElementById('uno-fb-reset');
          if (rs) rs.addEventListener('click', function () {
            try { localStorage.setItem('myuno_force_unregister_sw', '1'); } catch (e) {}
            window.location.reload();
          });
        }, TIMEOUT_MS);
      })();
    </script>
