    <!-- Version check with forced reload on mismatch -->
    <script>
      (function() {
        function hasUnsavedDrafts() {
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (key && key.indexOf('vendor_draft_property_editor_') === 0) return true;
            }
          } catch(e) {}
          return false;
        }

        function safeReload() {
          if (hasUnsavedDrafts()) {
            console.log('[myUNO] Unsaved drafts detected — deferring reload until user leaves editor');
            window.__swPendingReload = true;
            return false;
          }
          return true;
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!window.__swReloading && safeReload()) {
              window.__swReloading = true;
              window.location.reload();
            }
          });
          
          navigator.serviceWorker.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'SW_UPDATED') {
              console.log('[myUNO] SW_UPDATED received');
              if (!window.__swReloading && safeReload()) {
                window.__swReloading = true;
                window.location.href = window.location.href;
              }
            }
          });
        }
        
        fetch('/version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var serverVersion = data.version;
            var storedVersion = localStorage.getItem('manifest_version');
            var metaTag = document.querySelector('meta[name="version"]');
            var htmlVersion = metaTag ? metaTag.getAttribute('content') : null;
            
            console.log('[myUNO] Server: ' + serverVersion + ', Stored: ' + storedVersion + ', HTML: ' + htmlVersion);
            localStorage.setItem('manifest_version', serverVersion);
            localStorage.setItem('app_version', serverVersion);
            
            var needsReload = false;
            if (storedVersion && storedVersion !== serverVersion) needsReload = true;
            if (htmlVersion && htmlVersion !== serverVersion) needsReload = true;
            
            if (needsReload) {
              if (hasUnsavedDrafts()) {
                console.log('[myUNO] Version mismatch but unsaved drafts — deferring reload');
                window.__swPendingReload = true;
                return;
              }
              console.log('[myUNO] Version mismatch! Clearing all caches and reloading...');
              
              var reloadKey = 'uno_reloaded_for_' + serverVersion;
              if (sessionStorage.getItem(reloadKey)) {
                console.log('[myUNO] Already reloaded for ' + serverVersion + ', skipping');
                return;
              }
              sessionStorage.setItem(reloadKey, '1');
              
              var swPromise = Promise.resolve();
              if ('serviceWorker' in navigator) {
                swPromise = navigator.serviceWorker.getRegistrations().then(function(regs) {
                  return Promise.all(regs.map(function(reg) { return reg.unregister(); }));
                });
              }
              
              var cachePromise = Promise.resolve();
              if ('caches' in window) {
                cachePromise = caches.keys().then(function(keys) {
                  return Promise.all(keys.map(function(key) { return caches.delete(key); }));
                });
              }
              
              Promise.all([swPromise, cachePromise]).then(function() {
                console.log('[myUNO] Caches cleared, reloading...');
                window.location.reload();
              });
            }
          })
          .catch(function() {
            console.log('[myUNO] Version check failed (offline?)');
          });
      })();
    </script>

  <body>
    <!-- Inline critical CSS for fast FCP — supports light & dark -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%;font-family:'DM Sans',system-ui,-apple-system,sans-serif}
      body{min-height:100vh;background:#08101E;color:#EDF2FF;-webkit-font-smoothing:antialiased}
      html.light body{background:#fafaf9;color:#1a1a19}
      #root{min-height:100vh;display:flex;flex-direction:column}
      .uno-splash{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#08101E}
      html.light .uno-splash{background:#fafaf9}
      .uno-splash svg{width:48px;height:48px;animation:uno-spin 1s linear infinite}
      html.light .uno-splash svg{stroke:#0d6e4f}
      @keyframes uno-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    </style>
    <!-- Apply stored theme before paint to prevent flash -->
    <script>
      (function(){try{var t=localStorage.getItem('myuno-theme');if(t==='light'||(t==='system'&&window.matchMedia('(prefers-color-scheme:light)').matches)){document.documentElement.classList.remove('dark');document.documentElement.classList.add('light')}}catch(e){}})();
    </script>
    <div id="root">
      <div class="uno-splash" aria-label="Loading myUNO">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#00D68F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
