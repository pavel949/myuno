<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Force fresh content - no caching for HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>myUNO - All Services in One</title>
    <meta name="description" content="myUNO - Home is where myUNO is. Your life abroad, simplified." />
    <meta name="author" content="myUNO" />
    <meta name="theme-color" content="#d4af37" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="myUNO" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="canonical" href="https://myuno.app" />

    <meta property="og:title" content="myUNO - Home is where myUNO is" />
    <meta property="og:description" content="Your life abroad, simplified" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myuno.app" />
    <meta property="og:image" content="https://myuno.app/og-image.png" />
    <meta property="og:site_name" content="myUNO" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@myUNOapp" />
    <meta name="twitter:image" content="https://myuno.app/og-image.png" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://api.mapbox.com" />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    
    <!-- Early version check - runs BEFORE React loads -->
    <script>
      (function() {
        var CURRENT_VERSION = '3.3.1';
        var stored = localStorage.getItem('app_version');
        
        if (stored !== CURRENT_VERSION) {
          console.log('[myUNO] Version ' + CURRENT_VERSION + ' - cleaning caches');
          localStorage.setItem('app_version', CURRENT_VERSION);
          localStorage.setItem('last_cache_cleanup', Date.now().toString());
          
          // Delete all caches
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(key) { caches.delete(key); });
            });
          }
          
          // Unregister service workers
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(reg) { reg.unregister(); });
            });
          }
          
          // If upgrading (not first visit), reload to home
          if (stored) {
            setTimeout(function() {
              window.location.replace('/');
            }, 100);
          }
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
