<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Force fresh content - no caching for HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>myUNO - All Services in One</title>
    <meta name="description" content="myUNO - Home is where myUNO is. Your life abroad, simplified." />
    <meta name="author" content="myUNO" />
    <meta name="theme-color" content="#d4af37" />
    <meta name="version" content="3.5.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="myUNO" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="canonical" href="https://myuno.app" />

    <meta property="og:title" content="myUNO - Home is where myUNO is" />
    <meta property="og:description" content="Your life abroad, simplified" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myuno.app" />
    <meta property="og:image" content="https://myuno.app/og-image.png" />
    <meta property="og:site_name" content="myUNO" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@myUNOapp" />
    <meta name="twitter:image" content="https://myuno.app/og-image.png" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://api.mapbox.com" />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    
    <!-- Blocking splash screen while version check -->
    <style id="splash-styles">
      #version-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0a0a0b 0%, #1a1a1b 100%);
        color: #d4af37;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.3s ease-out;
      }
      #version-splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash-logo {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }
      #splash-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(212, 175, 55, 0.2);
        border-top-color: #d4af37;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    
    <!-- Early version check - runs BEFORE React loads -->
    <script>
      (function() {
        var CURRENT_VERSION = '3.5.0';
        var VERSION_CHECK_TIMEOUT = 3000; // 3 second max wait
        
        // Create splash immediately
        function createSplash() {
          var splash = document.createElement('div');
          splash.id = 'version-splash';
          splash.innerHTML = '<div id="splash-logo">my<span style="background:#d4af37;color:#0a0a0b;padding:0.1em 0.3em;border-radius:6px;margin:0 0.2em;">U</span>UNO</div><div id="splash-spinner"></div>';
          document.body.appendChild(splash);
        }
        
        function removeSplash() {
          var splash = document.getElementById('version-splash');
          var styles = document.getElementById('splash-styles');
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(function() {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
              if (styles && styles.parentNode) styles.parentNode.removeChild(styles);
            }, 300);
          }
        }
        
        // AGGRESSIVE: Clear ALL caches immediately on load
        async function clearAllCaches() {
          console.log('[myUNO] Clearing all caches...');
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function(key) {
              console.log('[myUNO] Deleting cache:', key);
              return caches.delete(key);
            }));
          }
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function(reg) {
              console.log('[myUNO] Unregistering SW:', reg.scope);
              return reg.unregister();
            }));
          }
        }
        
        // LEVEL 1: Listen for SW controller change - immediate reload
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            console.log('[myUNO] New SW controller detected - reloading');
            window.location.reload();
          });
        }
        
        // LEVEL 2: Network-based version check (BLOCKING)
        var versionChecked = false;
        
        fetch('/version.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.json(); })
          .then(async function(data) {
            var serverVersion = data.version;
            var storedManifestVersion = localStorage.getItem('manifest_version');
            
            console.log('[myUNO] Server version: ' + serverVersion + ', Stored: ' + storedManifestVersion + ', Current: ' + CURRENT_VERSION);
            
            // If ANY version mismatch - clear and reload
            if ((storedManifestVersion && storedManifestVersion !== serverVersion) || 
                CURRENT_VERSION !== serverVersion) {
              console.log('[myUNO] Version mismatch! Clearing caches and reloading...');
              
              localStorage.setItem('manifest_version', serverVersion);
              localStorage.setItem('app_version', serverVersion);
              localStorage.setItem('last_cache_cleanup', Date.now().toString());
              
              await clearAllCaches();
              
              // Hard reload bypassing cache
              window.location.replace(window.location.origin + '/?_v=' + serverVersion);
              return;
            }
            
            // Versions match - allow app to load
            localStorage.setItem('manifest_version', serverVersion);
            localStorage.setItem('app_version', serverVersion);
            versionChecked = true;
            removeSplash();
          })
          .catch(function(err) {
            console.log('[myUNO] Version check failed (offline?), proceeding with cached version');
            versionChecked = true;
            removeSplash();
          });
        
        // LEVEL 3: Timeout fallback - don't block forever
        setTimeout(function() {
          if (!versionChecked) {
            console.log('[myUNO] Version check timeout, proceeding...');
            removeSplash();
          }
        }, VERSION_CHECK_TIMEOUT);
        
        // Create splash when DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', createSplash);
        } else {
          createSplash();
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
