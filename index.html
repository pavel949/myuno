<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Force fresh content - no caching for HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>myUNO - All Services in One</title>
    <meta name="description" content="myUNO - Home is where myUNO is. Your life abroad, simplified." />
    <meta name="author" content="myUNO" />
    <meta name="theme-color" content="#d4af37" />
    <meta name="version" content="3.7.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="myUNO" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="canonical" href="https://myuno.app" />

    <meta property="og:title" content="myUNO - Home is where myUNO is" />
    <meta property="og:description" content="Your life abroad, simplified" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myuno.app" />
    <meta property="og:image" content="https://myuno.app/og-image.png" />
    <meta property="og:site_name" content="myUNO" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@myUNOapp" />
    <meta name="twitter:image" content="https://myuno.app/og-image.png" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://api.mapbox.com" />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    
    <!-- Non-blocking version check -->
    <script>
      (function() {
        // Listen for SW controller change
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            console.log('[myUNO] New SW controller - reloading');
            window.location.reload();
          });
        }
        
        // Anti-loop protection
        var reloadKey = 'uno_reload_' + Date.now().toString().slice(0, -4); // ~10 sec window
        var recentReloads = Object.keys(sessionStorage).filter(function(k) {
          return k.startsWith('uno_reload_');
        });
        
        if (recentReloads.length > 2) {
          console.log('[myUNO] Too many reloads, skipping version check');
          recentReloads.forEach(function(k) { sessionStorage.removeItem(k); });
        } else {
          // Background version check (non-blocking)
          fetch('/version.json?_=' + Date.now(), { cache: 'no-store' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
              var serverVersion = data.version;
              var storedVersion = localStorage.getItem('manifest_version');
              
              console.log('[myUNO] Server: ' + serverVersion + ', Stored: ' + storedVersion);
              
              // Only reload if stored version exists AND differs
              if (storedVersion && storedVersion !== serverVersion) {
                console.log('[myUNO] New version available, clearing caches...');
                
                localStorage.setItem('manifest_version', serverVersion);
                localStorage.setItem('app_version', serverVersion);
                sessionStorage.setItem(reloadKey, '1');
                
                // Clear caches in background
                if ('caches' in window) {
                  caches.keys().then(function(keys) {
                    keys.forEach(function(key) { caches.delete(key); });
                  });
                }
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function(regs) {
                    regs.forEach(function(reg) { reg.unregister(); });
                  });
                }
                
                // Redirect to home
                setTimeout(function() {
                  window.location.href = '/';
                }, 100);
              } else {
                // Save version
                localStorage.setItem('manifest_version', serverVersion);
                localStorage.setItem('app_version', serverVersion);
              }
            })
            .catch(function() {
              console.log('[myUNO] Version check failed (offline?)');
            });
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
