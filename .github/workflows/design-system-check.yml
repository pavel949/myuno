name: Design system verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-system-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  isolated-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: isolated-verification-placeholder
      VITE_SUPABASE_PROJECT_ID: isolated-verification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install isolated browser dependencies
        run: |
          npm ci
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Guard authored theme sources
        run: |
          npm run design:check
          node --test scripts/design-system-audit.test.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Actual public PMS admin and one-source rebrand
        run: |
          node scripts/qa/design-system-convergence.mjs artifacts/design-system/core
          python scripts/qa/design-system-convergence.py artifacts/design-system/core
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Actual shared public and authoring components
        run: DS_PUBLIC_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/public-adoption" node scripts/qa/design-system-public-adoption.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Actual Capital read states and responsive tables
        run: DS_CAPITAL_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/capital-adoption" node scripts/qa/design-system-capital-adoption.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Actual management and vendor page frames
        run: WORKSPACE_DS_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/workspace-adoption" node scripts/qa/ds-workspace-pages.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Actual media dialogs and local cropper
        run: DS_MEDIA_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/media-adoption" node scripts/qa/design-system-media-surfaces.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Actual portal layout surfaces
        run: DS_PORTALS_CSS="$GITHUB_WORKSPACE/artifacts/design-system/core/pms/normal.css" DS_PORTALS_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/portals" node scripts/qa/design-system-portals.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Shared forms dialogs and canonical spacing
        run: SHARED_SURFACES_CSS_FILE="$GITHUB_WORKSPACE/artifacts/design-system/core/pms/normal.css" SHARED_SURFACES_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/shared" node scripts/qa/shared-surfaces-ui.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: One-source card spacing variant
        run: SHARED_SURFACES_CSS_FILE="$GITHUB_WORKSPACE/artifacts/design-system/core/pms/rebrand.css" SHARED_SURFACES_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/shared-rebrand" SHARED_SURFACES_REPRESENTATIVE=1 SHARED_SURFACES_EXPECT_CARD_PADDING=24 node scripts/qa/shared-surfaces-ui.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Actual consumer header service forms and order read states
        run: |
          node scripts/qa/consumer-mobile-header.mjs artifacts/design-system/consumer-header
          python scripts/qa/consumer-mobile-header.py artifacts/design-system/consumer-header
          SERVICES_A11Y_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/services" node scripts/qa/services-compact-accessibility.mjs
          SERVICES_CLEARANCE_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/clearance" node scripts/qa/services-floating-clearance.mjs
          ORDERS_QA_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/orders" node scripts/qa/orders-readable-names.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Actual property order actions with bottom navigation and chat
        run: ORDERS_CLEARANCE_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/orders-clearance" node scripts/qa/orders-floating-clearance.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Actual property search history drafts filters and calendar
        run: SEARCH_CONTROLS_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/search-controls" node scripts/qa/search-controls-ui.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Actual route fallbacks and Team landmark ownership
        run: ROUTE_LAYOUT_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/route-layout" node scripts/qa/route-layout.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Actual property catalogue entry and pagination
        run: CATALOG_QA_OUTPUT="$GITHUB_WORKSPACE/artifacts/design-system/property-catalogue-entry" node scripts/qa/property-catalog-entry-ui.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Retain synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-system-${{ github.sha }}
          path: artifacts/design-system
          if-no-files-found: warn
          retention-days: 14
