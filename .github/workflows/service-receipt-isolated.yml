name: Service receipt isolated verification
on:
  pull_request:
    paths:
      - 'src/pages/services/ServiceOrderSuccess.tsx'
      - 'src/pages/services/__tests__/ServiceOrderSuccess.receipt.test.tsx'
      - 'src/lib/services/servicePresentation.ts'
      - 'scripts/qa/service-order-receipt-ui.*'
      - '.github/workflows/service-receipt-isolated.yml'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: service-receipt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: isolated-verification-placeholder
      VITE_SUPABASE_PROJECT_ID: isolated-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: |
          npm ci
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Owned receipt and recovery regressions
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
        run: npx vitest run src/pages/services/__tests__/ServiceOrderSuccess.receipt.test.tsx
      - name: Actual read-only receipt browser checks
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
        run: |
          node scripts/qa/service-order-receipt-ui.mjs
          python3 -c 'import json; from pathlib import Path; rows=json.loads(Path("/tmp/browser/service-order-receipt-isolated/results.json").read_text()); assert len(rows)==42 and len({(r["language"],r["width"],r["mode"]) for r in rows})==42 and all(r["outcome"]=="PASS" for r in rows)'
      - name: Retain exact-head browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-receipt-${{ github.sha }}
          path: /tmp/browser/service-order-receipt-isolated
          retention-days: 14
          if-no-files-found: warn
