name: PostgreSQL Snapshot (source configuration required)

# Native consistent PostgreSQL snapshots only. Restoration is an explicitly
# selected isolated operation; this workflow never overwrites a hosted target.
# SOURCE_DATABASE_URL must be provisioned by the credential owner. Without it
# the job fails closed; no anonymous REST fallback is permitted.

on:
  schedule:
    # Every 6 hours at minute 17 (off-peak to avoid contention)
    - cron: '17 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger from Actions tab
    inputs:
      reason:
        description: 'Reason for manual run (optional)'
        required: false
        default: 'manual snapshot'

concurrency:
  # Prevent overlapping runs (a long export must finish before next starts)
  group: db-mirror-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Export verified PostgreSQL snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 ships a global WebSocket; @supabase/realtime-js (loaded by
          # supabase-js createClient) cannot find one under Node 20.
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies and PostgreSQL tools
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Export a consistent native database snapshot
        run: node scripts/export-data.mjs
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          SNAPSHOT_DIRECTORY: tmp/snapshot
          SNAPSHOT_SCHEMAS: public

      - name: Upload export artifact (audit trail, 7-day retention)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: db-snapshot-${{ github.run_id }}
          path: tmp/snapshot/
          retention-days: 7
          if-no-files-found: error

      - name: Report bounded backup scope
        if: success()
        run: |
          echo 'Verified PostgreSQL public-schema snapshot created. No target database was changed. Restore rehearsal and external Auth/Storage/deployment recovery remain separate gates.' >> "$GITHUB_STEP_SUMMARY"
