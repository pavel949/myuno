name: DB Mirror Snapshot (Lovable Cloud → Own Supabase)

# Verified public-table row mirror, not a full database/Auth/Storage backup.
#
# Strategy: REST-based dump via @supabase/supabase-js (bypasses need for direct
# Postgres replication access, which Lovable Cloud does not provide).
#
# Existing rows are updated; absent source rows are not deleted. Full recovery
# requires a separately tested database and Storage backup. Never upload plaintext.

on:
  schedule:
    # Every 6 hours at minute 17 (off-peak to avoid contention)
    - cron: '17 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger from Actions tab
    inputs:
      reason:
        description: 'Reason for manual run (optional)'
        required: false
        default: 'manual snapshot'

      restore_to_mirror:
        description: 'Explicitly import verified rows into isolated mirror (may execute target triggers)'
        type: boolean
        required: false
        default: false

concurrency:
  # Prevent overlapping runs (a long export must finish before next starts)
  group: db-mirror-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: Export → Import snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 ships a global WebSocket; @supabase/realtime-js (loaded by
          # supabase-js createClient) cannot find one under Node 20.
          node-version: '22'
          cache: 'npm'

      - name: Preflight — global WebSocket available
        run: |
          node -e "if (typeof globalThis.WebSocket !== 'function') { console.error('FATAL: globalThis.WebSocket is unavailable in Node ' + process.version + '. @supabase/realtime-js needs it; use Node >= 22.'); process.exit(1) } else { console.log('WebSocket OK on Node ' + process.version) }"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Verify required backup credentials
        env:
          SOURCE_SERVICE_ROLE_KEY: ${{ secrets.SOURCE_SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          node --input-type=module -e "import { requirePrivilegedKey } from './scripts/lib/data-snapshot.mjs'; import { snapshotEncryptionKey } from './scripts/encrypt-snapshot.mjs'; requirePrivilegedKey(process.env.SOURCE_SERVICE_ROLE_KEY); snapshotEncryptionKey(process.env.BACKUP_ENCRYPTION_KEY);"

      - name: Export data from Lovable Cloud (source)
        run: node scripts/export-data.mjs
        env:
          SOURCE_SERVICE_ROLE_KEY: ${{ secrets.SOURCE_SUPABASE_SERVICE_ROLE_KEY }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Encrypt verified snapshot
        run: node scripts/encrypt-snapshot.mjs
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

      - name: Upload encrypted export artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-snapshot-${{ github.run_id }}
          path: tmp/encrypted/snapshot.bin
          retention-days: 7
          if-no-files-found: error

      - name: Import data into target Supabase (erfwtoavipwjqmylpizt)
        if: github.event_name == 'workflow_dispatch' && inputs.restore_to_mirror == true
        run: node scripts/import-data.mjs
        env:
          SERVICE_ROLE_KEY: ${{ secrets.TARGET_SUPABASE_SERVICE_ROLE_KEY }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Remove plaintext row exports
        if: always()
        run: rm -rf tmp/export

      - name: Report summary
        if: always()
        run: |
          echo "### DB Mirror Snapshot Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** kakkwibljrjsawxgnupk (Lovable Cloud)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** erfwtoavipwjqmylpizt (own Supabase)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage:** verified public-table rows; Auth, Storage objects and schema are outside this mirror" >> $GITHUB_STEP_SUMMARY
