name: Map production browser diagnosis
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa/map-production-smoke.mjs'
      - '.github/workflows/map-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Read-only deployed map across three browser engines and two viewports
        env:
          MAP_BROWSER_ENGINES: chromium,firefox,webkit
        run: node scripts/qa/map-production-smoke.mjs
      - name: Preserve diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: map-production-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/browser/map-production/
          if-no-files-found: error
          retention-days: 14
