name: e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    # This legacy suite seeds a backend using secrets. Never run it automatically
    # on pull requests against the shared production backend. PR coverage lives
    # in connected-system-check.yml and uses synthetic, network-denying fixtures.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_TEST_TOKEN: ${{ secrets.E2E_TEST_TOKEN }}
      VITE_BYPASS_COMING_SOON: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright (CI config, chromium only)
        run: npx playwright test --config=playwright.ci.config.ts
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
