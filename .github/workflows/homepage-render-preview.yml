name: Exact-head homepage diagnostic renders
on:
  push:
    branches: [qa/homepage-render-20261117]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: isolated-verification-placeholder
      VITE_SUPABASE_PROJECT_ID: isolated-verification
      HOME_GALLERY_OUTPUT: /tmp/homepage-render
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9bb7e8f968077b6eac18c3462da624bd92090ad4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked render dependencies
        run: |
          npm ci
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Build actual homepage with synthetic reads
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/homepage-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/src/index.css?direct >/dev/null && break; sleep 1; done
          node scripts/qa/homepage-galleries-ui.mjs --build-only
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Capture desktop and mobile without production network
        run: |
          python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright
          out=Path('/tmp/homepage-render')
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(args=['--no-sandbox'])
              for width in [390,1440]:
                ctx=await browser.new_context(viewport={'width':width,'height':1000},reduced_motion='reduce',service_workers='block')
                async def route(r):
                  u=urlparse(r.request.url); name='fixture.html' if u.path=='/fixture' else u.path.lstrip('/')
                  f=out/name
                  if name.startswith('fonts/') or name in ['catalog/flowers/pink-garden-roses.webp','yachts/catamaran-53-1.webp']: f=Path.cwd()/'public'/name
                  if u.netloc=='localhost:8080' and f.is_file():
                    types={'.html':'text/html','.js':'text/javascript','.css':'text/css','.svg':'image/svg+xml','.webp':'image/webp','.woff2':'font/woff2'}
                    await r.fulfill(path=str(f),content_type=types.get(f.suffix,'application/octet-stream'))
                  else: await r.abort()
                await ctx.route('**/*',route)
                page=await ctx.new_page()
                await page.goto('http://localhost:8080/fixture?lang=ru',wait_until='domcontentloaded')
                await page.evaluate('document.fonts.ready')
                for img in await page.locator('img').all():
                  if await img.is_visible():
                    await img.scroll_into_view_if_needed()
                    await page.wait_for_function('(img)=>img.complete',arg=await img.element_handle())
                await page.locator('.home-rail-viewport').evaluate_all('(els)=>els.forEach(el=>el.scrollLeft=0)')
                await page.evaluate('window.scrollTo(0,0)')
                await page.screenshot(path=str(out/f'ru-{width}-homepage-synthetic.png'),full_page=True)
                await ctx.close()
              await browser.close()
          asyncio.run(main())
          (out/'RENDER-NOTICE.txt').write_text('Exact source 9bb7e8f968077b6eac18c3462da624bd92090ad4. Actual homepage components with synthetic public catalogue data. Diagnostic renders only, NOT a verification pass or deployment. No production reads/writes. Existing category photographs are editorial imagery.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-render-9bb7e8f
          path: |
            /tmp/homepage-render/*.png
            /tmp/homepage-render/*receipt.json
            /tmp/homepage-render/RENDER-NOTICE.txt
            /tmp/homepage-vite.log
          retention-days: 7

