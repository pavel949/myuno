name: Read-only live rental map
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa/rental-map-live-smoke.mjs'
      - '.github/workflows/rental-map-live-smoke.yml'
permissions:
  contents: read
jobs:
  live-rental-map:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa/rental-map-live-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-rental-map-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/browser/rental-map-live/
          if-no-files-found: error
          retention-days: 7
