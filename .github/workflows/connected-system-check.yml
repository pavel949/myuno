name: Connected system isolated verification
on:
  push:
    branches: [codex/connected-system-2026-10-17]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Superseded commits of the same PR do not consume duplicate runners.
# Manual runs and different PRs remain independent; no verification is skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: isolated-verification-placeholder
      VITE_SUPABASE_PROJECT_ID: isolated-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies and isolated test tools
        run: |
          npm ci
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          if ! ls /usr/lib/postgresql/*/bin/postgres >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
          for binary in /usr/lib/postgresql/*/bin/postgres; do
            dirname "$binary" >> "$GITHUB_PATH"
            break
          done
      - name: Early network-denying combined layout geometry
        id: layout_browser
        timeout-minutes: 6
        continue-on-error: true
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/combined-layout-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:8080/src/index.css?direct >/dev/null && break
            sleep 1
          done
          python3 -m unittest discover -s scripts/qa -p 'test_combined_layout_initializer.py'
          python3 -m unittest discover -s scripts/qa -p 'test_dialog_readiness.py'
          timeout 240s node scripts/qa/combined-layout-ui.mjs
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Upload combined layout evidence early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-layout-evidence
          path: |
            /tmp/browser/combined-layout-isolated/
            /tmp/combined-layout-vite.log
          retention-days: 14
      - name: Network-denying header gutters and partner states
        id: header_partner_browser
        timeout-minutes: 5
        continue-on-error: true
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/header-partner-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:8080/src/index.css?direct >/dev/null && break
            sleep 1
          done
          node scripts/qa/combined-layout-ui.mjs --build-only
          timeout 180s python3 scripts/qa/header-partner-layout-ui.py /tmp/browser/combined-layout-isolated
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Upload header and partner evidence early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-partner-layout-evidence
          path: |
            /tmp/browser/header-partner-isolated/
            /tmp/browser/combined-layout-isolated/bundle-inputs.json
            /tmp/header-partner-vite.log
          retention-days: 14
      - name: Network-denying platform dashboard states
        id: dashboard_browser
        timeout-minutes: 6
        continue-on-error: true
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/admin-dashboard-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:8080/src/index.css?direct >/dev/null && break
            sleep 1
          done
          timeout 240s node scripts/qa/admin-dashboard-ui.mjs
          node scripts/qa/assert-ui-evidence.mjs /tmp/browser/admin-dashboard-isolated/results.json 60
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Upload dashboard evidence early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-evidence
          path: |
            /tmp/browser/admin-dashboard-isolated/
            /tmp/admin-dashboard-vite.log
          retention-days: 14
      - name: Network-denying actual dashboard shell
        id: dashboard_shell_browser
        timeout-minutes: 6
        continue-on-error: true
        run: |
          node --test scripts/qa/assert-ui-evidence.check.mjs
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/admin-dashboard-shell-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:8080/src/index.css?direct >/dev/null && break
            sleep 1
          done
          timeout 240s node scripts/qa/admin-dashboard-shell-ui.mjs
          node scripts/qa/assert-ui-evidence.mjs /tmp/browser/admin-dashboard-shell-isolated/results.json 18
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Upload actual dashboard shell evidence early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-shell-evidence
          path: |
            /tmp/browser/admin-dashboard-shell-isolated/
            /tmp/admin-dashboard-shell-vite.log
          retention-days: 14
      - name: Network-denying wide public surface geometry
        id: public_wide_browser
        timeout-minutes: 7
        continue-on-error: true
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/public-wide-vite.log 2>&1 &
          preview_pid=$!
          trap 'fixture_status=$?; kill "$preview_pid" 2>/dev/null || true; exit "$fixture_status"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:8080/src/index.css?direct >/dev/null && break
            sleep 1
          done
          timeout 360s node scripts/qa/public-wide-layout-ui.mjs
          python3 -c 'import json; from pathlib import Path; rows=json.loads(Path("/tmp/browser/public-wide-isolated/results.json").read_text()); assert len(rows)==76 and all(row.get("outcome")=="PASS" for row in rows), {"cases":len(rows),"failed":sum(row.get("outcome")!="PASS" for row in rows)}'
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Upload wide public surface evidence early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-wide-layout-evidence
          path: |
            /tmp/browser/public-wide-isolated/
            /tmp/public-wide-vite.log
          retention-days: 14
      - name: Typecheck
        id: types
        continue-on-error: true
        run: npm run typecheck
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Full unit and isolated PostgreSQL suite
        id: unit
        continue-on-error: true
        run: npm test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile=unit-results.json
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Upload unit and PostgreSQL evidence early
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-unit-evidence
          path: unit-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Focused connected workflows in three timezones
        id: focused
        continue-on-error: true
        run: |
          for zone in UTC Asia/Bangkok America/Los_Angeles; do
            TZ="$zone" npx vitest run src/hooks/__tests__/pmsFlow.integration.test.tsx src/pages/owner/__tests__/MCBookingsPage.test.tsx src/hooks/__tests__/roomCategoryCache.test.tsx src/pages/property/PropertyIndex.test.tsx src/hooks/__tests__/formDraftLifecycle.test.tsx src/components/auth/InvestorGuard.test.tsx src/components/onboarding/Coachmarks.test.tsx || exit 1
          done
          node scripts/qa/scheduled-backup-integrity.mjs
          node scripts/qa/vendor-outreach-boundary.mjs
          node scripts/qa/currency-rate-updater-boundary.mjs
          node scripts/qa/transfer-operator-conflicts.mjs
          node scripts/qa/final-order-handlers.mjs
          python3 -m unittest discover -s scripts/qa -p 'test_browser_fixture_runner.py'
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Production build with synthetic configuration
        id: build
        continue-on-error: true
        run: npm run build
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Architecture diagnostic (source/type census, not a live-schema certificate)
        run: node scripts/architecture-scan.mjs --json > architecture-results.json
      - name: Lint diagnostic
        id: lint
        continue-on-error: true
        run: npm run lint
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Network-denying compact home smoke fixture
        id: home_browser
        timeout-minutes: 4
        continue-on-error: true
        # Explicit browser opt-in; the default smoke matrix shares the 180s
        # per-fixture cap. Exhaustive coverage is an optional separate run.
        run: timeout 180s node scripts/qa/compact-personal-home-ui.mjs --run-browser
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Network-denying PMS browser fixtures
        timeout-minutes: 30
        id: browser
        continue-on-error: true
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/isolated-vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:8080/src/index.css?direct >/dev/null && break
            sleep 1
          done
          # Two isolated browsers at most; every fixture retains its 180s limit.
          python3 scripts/qa/browser_fixture_runner.py
        env:
          NODE_OPTIONS: --require ./scripts/qa/local-network-only.cjs
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-system-evidence
          path: |
            unit-results.json
            architecture-results.json
            /tmp/browser/
            /tmp/isolated-vite.log
          retention-days: 14
      - name: Enforce verification outcomes
        if: always()
        env:
          TYPES: ${{ steps.types.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          HOME_BROWSER: ${{ steps.home_browser.outcome }}
          LAYOUT_BROWSER: ${{ steps.layout_browser.outcome }}
          HEADER_PARTNER_BROWSER: ${{ steps.header_partner_browser.outcome }}
          DASHBOARD_BROWSER: ${{ steps.dashboard_browser.outcome }}
          DASHBOARD_SHELL_BROWSER: ${{ steps.dashboard_shell_browser.outcome }}
          PUBLIC_WIDE_BROWSER: ${{ steps.public_wide_browser.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          printf 'types=%s unit=%s focused=%s build=%s browser=%s home_browser=%s lint=%s\n' "$TYPES" "$UNIT" "$FOCUSED" "$BUILD" "$BROWSER" "$HOME_BROWSER" "$LINT" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'layout_browser=%s\n' "$LAYOUT_BROWSER" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'header_partner_browser=%s\n' "$HEADER_PARTNER_BROWSER" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'dashboard_browser=%s\n' "$DASHBOARD_BROWSER" | tee -a "$GITHUB_STEP_SUMMARY"
          printf 'dashboard_shell_browser=%s\n' "$DASHBOARD_SHELL_BROWSER" | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/qa/assert-ui-evidence.mjs /tmp/browser/admin-dashboard-isolated/results.json 60
          node scripts/qa/assert-ui-evidence.mjs /tmp/browser/admin-dashboard-shell-isolated/results.json 18
          printf 'public_wide_browser=%s\n' "$PUBLIC_WIDE_BROWSER" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; from pathlib import Path; rows=json.loads(Path("/tmp/browser/public-wide-isolated/results.json").read_text()); assert len(rows)==76 and all(row.get("outcome")=="PASS" for row in rows), {"cases":len(rows),"failed":sum(row.get("outcome")!="PASS" for row in rows)}'
          test "$TYPES" = success && test "$UNIT" = success && test "$FOCUSED" = success && test "$BUILD" = success && test "$BROWSER" = success && test "$HOME_BROWSER" = success && test "$LAYOUT_BROWSER" = success && test "$HEADER_PARTNER_BROWSER" = success && test "$DASHBOARD_BROWSER" = success && test "$DASHBOARD_SHELL_BROWSER" = success && test "$PUBLIC_WIDE_BROWSER" = success && test "$LINT" = success
