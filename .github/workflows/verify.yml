name: dependency-repair
on:
  workflow_dispatch:
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve compatible lint dependency
        run: |
          npm view minimatch@3 version --json --fetch-retries=0 --fetch-timeout=30000 > /tmp/minimatch-versions.json
          VERSION=$(node -e 'const v=require("/tmp/minimatch-versions.json"); console.log(Array.isArray(v)?v.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).at(-1):v)')
          npm pkg set "overrides.eslint-plugin-jsx-a11y.minimatch=$VERSION"
          npm install --package-lock-only --ignore-scripts --fetch-retries=0 --fetch-timeout=30000
          git diff -- package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-repair
          path: |
            package.json
            package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
