name: verify

# Engineering-quality gate. Before this workflow the CI pipeline ran NO
# typecheck, lint, or unit tests — a PR that broke types or tests passed CI.
#
# `typecheck` is a hard, blocking gate (green as of this workflow's creation).
# `test` and `lint` run for visibility but are non-blocking for now:
#   - test: 6 pre-existing content/persona/IA drift failures must be triaged
#     before this becomes required (they are unrelated to app logic).
#   - lint: the eslint 9 + @eslint/eslintrc/ajv toolchain resolves inconsistently
#     across the npm vs bun dependency trees (see the triple-lockfile follow-up);
#     must be fixed before this becomes required.
# Flip `continue-on-error` to false on each once the above are resolved.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (blocking)
        run: npm run typecheck

      - name: Unit tests (non-blocking until pre-existing failures triaged)
        continue-on-error: true
        run: npm test

      - name: Lint (non-blocking until eslint toolchain fixed)
        continue-on-error: true
        run: npm run lint
